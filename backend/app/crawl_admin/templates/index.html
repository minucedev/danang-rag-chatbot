<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crawl Admin — Đà Nẵng RAG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/crawl/static/style.css?v=2">
</head>

<body>
  <div class="shell">
    <header>
      <h1>🕷️ Crawl Admin <span>Foody · Traveloka · Booking</span></h1>
      <div id="status-badge" class="badge badge-idle">đang tải…</div>
    </header>

    <!-- ── Engine Cards ── -->
    <div class="card">
      <div class="engine-bar">
        <div class="card-title"><i class="icon">⚙️</i> Engines</div>
        <button id="run-all" class="btn btn-primary">▶ Chạy tất cả</button>
      </div>
      <div id="jobs" class="engines"></div>
    </div>

    <!-- ── Log + History ── -->
    <div class="grid-2">
      <div class="card">
        <div class="card-title"><i class="icon">📋</i> Log realtime</div>
        <div id="log" class="log-box"></div>
      </div>
      <div class="card">
        <div class="card-title"><i class="icon">🕐</i> Lịch sử chạy</div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Engine</th>
                <th>Trigger</th>
                <th>Trạng thái</th>
                <th>OK / Total</th>
                <th>Thời gian</th>
              </tr>
            </thead>
            <tbody id="runs-body"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- ── Foody Entities ── -->
    <div class="card" style="margin-top:16px">
      <details>
        <summary>Nhà hàng</summary>
        <div class="table-wrap" style="margin-top:12px">
          <table>
            <thead>
              <tr>
                <th>Tên</th>
                <th>Quận</th>
                <th>Trạng thái</th>
                <th>Reviews</th>
                <th>Lần crawl gần nhất</th>
              </tr>
            </thead>
            <tbody id="entities-body"></tbody>
          </table>
        </div>
      </details>
    </div>

    <!-- ── Hotel Entities ── -->
    <div class="card" style="margin-top:16px">
      <details>
        <summary>Khách sạn</summary>
        <div class="table-wrap" style="margin-top:12px">
          <table>
            <thead>
              <tr>
                <th>Tên khách sạn</th>
                <th>Nguồn/Platform</th>
                <th>Đánh giá</th>
                <th>Reviews</th>
                <th>Địa chỉ</th>
              </tr>
            </thead>
            <tbody id="hotels-body"></tbody>
          </table>
        </div>
      </details>
    </div>
  </div>

  <script>
    const API = "/admin/crawl";
    const fmtTime = (ts) => ts ? new Date(ts * 1000).toLocaleString("vi-VN") : "—";
    const stClass = (s) => ({ done: "st-done", error: "st-error", running: "st-running", crawling: "st-crawling", pending: "st-pending" }[s] || "");

    async function loadJobs() {
      const jobs = await (await fetch(`${API}/api/jobs`)).json();
      document.getElementById("jobs").innerHTML = jobs.map(j => `
    <div class="engine ${j.running ? 'running' : ''}">
      <div class="engine-name">${j.label}</div>
      <div class="engine-meta">
        Lần chạy: ${fmtTime(j.last_run_at)}<br>
        Trạng thái: <span class="${stClass(j.last_status)}">${j.last_status || "—"}</span>
      </div>
      <button data-key="${j.key}" class="btn btn-run run-job" ${j.running ? 'disabled' : ''}>
        ${j.running ? "⏳ đang chạy…" : "▶ Chạy"}</button>
    </div>`).join("");
      document.querySelectorAll(".run-job").forEach(b => b.onclick = async () => {
        const res = await fetch(`${API}/api/jobs/${b.dataset.key}/run`, { method: "POST" });
        if (res.status === 409) alert("Đang có một lượt crawl chạy.");
      });
    }

    async function loadRuns() {
      const runs = await (await fetch(`${API}/api/runs`)).json();
      document.getElementById("runs-body").innerHTML = runs.map(r => `
    <tr>
      <td>${r.id}</td><td>${r.engine || ""}</td><td>${r.trigger}</td>
      <td class="${stClass(r.status)}">${r.status}</td>
      <td>${r.ok}/${r.total}</td><td>${fmtTime(r.started_at)}</td>
    </tr>`).join("") || `<tr><td colspan="6" class="empty-row">Chưa có run nào.</td></tr>`;
    }

    async function loadEntities() {
      const rows = await (await fetch(`${API}/api/entities`)).json();
      const foodyRows = rows.filter(e => !e.url.includes("booking.com") && !e.url.includes("traveloka.com"));
      document.getElementById("entities-body").innerHTML = foodyRows.slice(0, 200).map(e => `
    <tr>
      <td>${e.name || "<span style='color:var(--text2)'>(chưa có)</span>"}</td>
      <td>${e.district || ""}</td><td class="${stClass(e.status)}">${e.status}</td>
      <td>${e.review_count ?? ""}</td><td>${fmtTime(e.last_crawl_at)}</td>
    </tr>`).join("") || `<tr><td colspan="5" class="empty-row">Chưa có entity.</td></tr>`;
    }

    async function loadHotels() {
      const rows = await (await fetch(`${API}/api/hotels`)).json();
      document.getElementById("hotels-body").innerHTML = rows.slice(0, 200).map(h => `
    <tr>
      <td>${h.name || "<span style='color:var(--text2)'>(chưa có)</span>"}</td>
      <td>${h.platform || ""}</td>
      <td>${h.rating || ""}</td>
      <td>${h.review_count ?? ""}</td>
      <td>${h.address || ""}</td>
    </tr>`).join("") || `<tr><td colspan="5" class="empty-row">Chưa có dữ liệu khách sạn.</td></tr>`;
    }

    async function loadState() {
      const { state } = await (await fetch(`${API}/api/state`)).json();
      const b = document.getElementById("status-badge");
      if (state.running) {
        b.textContent = "⏳ " + (state.engine || "crawling");
        b.className = "badge badge-busy";
      } else {
        b.textContent = "✓ rảnh";
        b.className = "badge badge-idle";
      }
      return state.running;
    }

    document.getElementById("run-all").onclick = async () => {
      const res = await fetch(`${API}/api/jobs/run-all`, { method: "POST" });
      if (res.status === 409) alert("Đang có một lượt crawl chạy.");
    };

    const logEl = document.getElementById("log");
    const es = new EventSource(`${API}/api/logs/stream`);
    es.onmessage = (e) => { logEl.textContent += e.data + "\n"; logEl.scrollTop = logEl.scrollHeight; };

    async function tick() {
      const running = await loadState();
      await Promise.all([loadJobs(), loadRuns(), loadEntities(), loadHotels()]);
      setTimeout(tick, running ? 2500 : 7000);
    }
    tick();
  </script>
</body>

</html>
